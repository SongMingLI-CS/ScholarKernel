name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: scholar_upgrade
        ports:
          - 55446:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d scholar_upgrade"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:password@127.0.0.1:55446/scholar_upgrade
      DIRECT_URL: postgresql://postgres:password@127.0.0.1:55446/scholar_upgrade
      ENCRYPTION_SECRET: ci-test-encryption-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Verify migration repeatability and schema parity
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Ordinary feature tests
        run: npm run test:quality

      - name: Agent job lifecycle tests
        run: npm run test:workflow

      - name: Persistent Job and document regressions
        run: SCHOLAR_UPGRADE_TEST_DATABASE=1 npm run test:upgrade

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: AGENT_DURABLE_JOBS=1 NEXT_PUBLIC_AGENT_EXECUTION=server OPENAI_API_KEY=local-fixture-key npm run test:e2e

      - name: Production build
        run: npm run build
